<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>G25 Heatmap Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1b1f27;--mu:#667085;--bd:#dfe3ea;--map:#e8edf3;--ac:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c24;--tx:#e6e9ef;--mu:#8b93a3;--bd:#2a303b;--map:#10151d;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181c24;--tx:#e6e9ef;--mu:#8b93a3;--bd:#2a303b;--map:#10151d;--ac:#60a5fa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
h1{font-size:18px;margin:0}h2{font-size:13px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.sub{color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:12px;padding:0 12px 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.side{display:flex;flex-direction:column;gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input[type=text],select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;font:inherit}
textarea{height:70px;font-size:11px}
input[type=range]{width:100%}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
input[type=color]{width:100%;height:30px;border:1px solid var(--bd);border-radius:6px;background:none;padding:2px}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
button.alt{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.seg button{flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.seg button.on{background:var(--ac);color:#fff}
.main{display:grid;gap:12px;min-width:0;grid-template-rows:minmax(440px,1fr) auto}
.mc{padding:0;overflow:hidden;position:relative;display:flex;flex-direction:column}
#map{flex:1;min-height:440px;width:100%;background:var(--map)}
.st{position:absolute;left:10px;bottom:10px;z-index:1000;pointer-events:none;color:#fff;background:rgba(60,60,66,.84);border-radius:4px;padding:4px 8px;margin:0;font-size:11px}
.lgd{position:absolute;top:10px;right:10px;z-index:1000;pointer-events:none;color:#fff;background:rgba(60,60,66,.84);border-radius:4px;padding:6px 8px;font-size:12px;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
#bar{width:18px;height:120px;border-radius:2px;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cw{position:relative;height:320px}
.tw{max-height:320px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);position:sticky;top:0;background:var(--card)}
tr.m{cursor:pointer}tr.m:hover{background:var(--bg)}
.pill{font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid var(--bd)}
.big{font-weight:600;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;color:var(--mu);white-space:nowrap;margin:-6px 0 0 8px;pointer-events:none;text-shadow:0 0 3px var(--bg)}
.note{font-size:11px;color:var(--mu);margin-top:6px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.main{grid-template-rows:none}#map{flex:none;height:60vh}}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-layer,.leaflet-tile-container{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;position:relative;outline:0}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}
.leaflet-pane>canvas,.leaflet-pane>svg{position:absolute;left:0;top:0}.leaflet-map-pane canvas{z-index:100}.leaflet-overlay-pane svg{position:absolute}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-left{left:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both;margin:10px}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-bar{border-radius:6px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.leaflet-bar a{display:block;width:30px;height:30px;line-height:30px;text-align:center;background:#fff;color:#111;text-decoration:none;font-weight:700;border-bottom:1px solid #ccc}
.leaflet-container{cursor:grab}.leaflet-control-attribution{background:rgba(255,255,255,.7);color:#333;font-size:10px;padding:0 5px;margin:0}.leaflet-control-attribution a{color:#0b5cd5}.leaflet-bottom .leaflet-control{margin:0}
</style></head><body>
<header><h1>G25 Heatmap Engine</h1><span class="sub">25-D Euclidean distance · real time · click any label or table row to retarget</span></header>
<div class="grid">
 <div class="side">
  <div class="card"><h2>Target & filters</h2>
   <label>Search population / sample</label><input type="text" id="q" placeholder="e.g. Yamnaya, Finnish, Viking…">
   <label>Target specimen</label><select id="target"></select>
   <label>Era</label><div class="row seg" id="era"><button data-e="All" class="on">All</button><button data-e="Ancient">Ancient</button><button data-e="Modern">Modern</button></div>
   <label>Max distance (blue end): <span class="big" id="dv">0.120</span></label>
   <input type="range" id="thr" min="0" max="0.5" step="0.005" value="0.12">
  </div>
  <div class="card"><h2>Basemap (CARTO)</h2>
   <label>API key</label><input type="password" id="ck" placeholder="Paste your CARTO API key" autocomplete="off">
   <label>Style</label><select id="cs"><option value="dark_all">Dark</option><option value="light_all">Light</option><option value="voyager">Voyager</option></select>
   <label>Tile URL template</label><input type="text" id="ct" value="https://basemaps.cartocdn.com/rastertiles/{style}/{z}/{x}/{y}.png?key={key}">
   <div class="row" style="margin-top:8px"><button id="ckb">Apply</button><button class="alt" id="ckc">Clear</button></div>
   <div class="note" id="kmsg">Enter your CARTO API key to load the basemap.</div>
  </div>
  <div class="card"><h2>Import G25 data</h2>
   <input type="file" id="fil" accept=".csv,.txt,.tsv" multiple>
   <label>…or paste rows</label>
   <textarea id="imp" placeholder="Name,PC1,…,PC25  (26 fields, e.g. Japanese:Japanese_1,…)&#10;or Name,lat,lon,Ancient|Modern,PC1,…,PC25"></textarea>
   <label>Era of these rows</label><select id="ie"><option value="Auto">Auto (guess from name)</option><option value="Modern">Modern</option><option value="Ancient">Ancient</option></select>
   <label>Extra coordinates (optional): Population,lat,lon</label>
   <textarea id="cin" placeholder="Karitiana,-9,-63&#10;Clovis_Anzick,46,-110.7"></textarea>
   <div class="row" style="margin-top:6px"><button id="load">Add rows</button><button class="alt" id="rmsyn">Clear built-in data</button></div>
   <div class="note" id="impmsg"></div>
  </div>
 </div>
 <div class="main">
  <div class="card mc"><div id="map"></div><div class="lgd"><b>Closer</b><span id="lmin"></span><i id="bar"></i><span id="lmax"></span><b>Farther</b></div><div class="note st" id="stat"></div></div>
  <div class="two">
   <div class="card"><h2>PCA · PC1 vs PC2</h2><div class="cw"><canvas id="pca"></canvas></div></div>
   <div class="card"><h2>Top genetic matches</h2><div class="tw"><table><thead><tr><th>#</th><th>Sample</th><th>d</th><th>Era</th><th>Lat, Lon</th></tr></thead><tbody id="tb"></tbody></table></div></div>
  </div>
 </div>
</div>

function parseRawData(text){
 text.split(/\r?\n/).forEach(l=>{
  const p=l.trim().split(/[,\t;]+/);
  if(p.length<26)return;
  const nm=p[0];
  const pop=nm.split(":")[0];
  const pl=placeOf(pop);
  const v=p.slice(1,26).map(Number);
  if(v.length===25 && !v.some(isNaN)){
   DATA.push({
    id: nm,
    pop: pop,
    lat: pl[0],
    lon: pl[1],
    era: pl[2]||"Modern",
    v: v
   });
  }
 });
}

parseRawData(RAW_G25_DATA);

function dist(a,b){let s=0;for(let i=0;i<25;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s)}

// map initialization
const map=L.map("map",{preferCanvas:true,minZoom:2,worldCopyJump:false}).setView([48,22],4);
let tiles=null;
function store(k,v){try{v===undefined?(localStorage.getItem(k)||""):localStorage.setItem(k,v)}catch(e){}}
function getS(k){try{return localStorage.getItem(k)||""}catch(e){return""}}
function setTiles(){
 const key=$("ck").value.trim(),tpl=$("ct").value.trim(),st=$("cs").value;
 store("g25_ck2",key);store("g25_ct2",tpl);store("g25_cs2",st);
 if(tiles){map.removeLayer(tiles);tiles=null}
 if(!key){$("kmsg").textContent="Enter your CARTO API key to load the basemap.";return}
 const url=tpl.replace("{style}",st).replace("{key}",encodeURIComponent(key));
 let err=0;
 tiles=L.tileLayer(url,{maxZoom:19,attribution:"&copy; OpenStreetMap &copy; CARTO"}).addTo(map);
 tiles.on("tileerror",()=>{if(!err++)$("kmsg").textContent="Tiles failed to load: check the key or URL template."});
 tiles.on("tileload",()=>{$("kmsg").textContent="Tiles loaded successfully."});
 $("kmsg").textContent="Loading tiles…";
}
new ResizeObserver(()=>map.invalidateSize()).observe($("map"));setTimeout(()=>map.invalidateSize(),50);
const lg=L.layerGroup().addTo(map);let tm=null;
const heat=L.heatLayer([],{radius:30,blur:24,max:1,minOpacity:.25,maxZoom:7,gradient:{.2:"#3b82f6",.55:"#facc15",1:"#ef4444"}}).addTo(map);
$("bar").style.background="linear-gradient(to bottom,#ef4444,#facc15 55%,#3b82f6)";
const dg=L.layerGroup().addTo(map);

function labels(){
 lg.clearLayers();if(map.getZoom()<5)return;const bd=map.getBounds().pad(.2),seen={};
 filtered().forEach(d=>{if(seen[d.pop]||!bd.contains([d.lat,d.lon]))return;seen[d.pop]=1;L.marker([d.lat,d.lon],{icon:L.divIcon({className:"lbl",html:d.pop.replace(/_/g," "),iconSize:[0,0]}),interactive:false}).addTo(lg)});
}
map.on("moveend",labels);

let era="All";
$("era").onclick=e=>{const b=e.target.closest("button");if(!b)return;era=b.dataset.e;[...$("era").children].forEach(x=>x.classList.toggle("on",x===b));refresh(true)};

function filtered(){const q=$("q").value.trim().toLowerCase();return DATA.filter(d=>(era==="All"||d.era===era)&&(!q||d.id.toLowerCase().includes(q)))}

function buildSel(){
 const f=filtered(),cur=$("target").value;$("target").innerHTML=f.map(d=>`<option value="${d.id}">${d.id}</option>`).join("");
 if(f.some(d=>d.id===cur))$("target").value=cur;else if(f.length)$("target").value=f[0].id;
}

let chart;
function refresh(rebuild){
 if(rebuild)buildSel();
 const t=DATA.find(d=>d.id===$("target").value);
 if(!t){$("tb").innerHTML="";heat.setLatLngs([]);if(chart){chart.data.datasets=[];chart.update()}$("stat").textContent="No data loaded.";return}
 const thr=+$("thr").value;$("dv").textContent=thr.toFixed(3);
 const f=filtered().filter(d=>d!==t).map(d=>({d,x:dist(t.v,d.v)})).sort((a,b)=>a.x-b.x);
 const within=f.filter(o=>o.x<=thr);
 heat.setLatLngs(within.map(o=>[o.d.lat,o.d.lon,Math.max(.05,1-o.x/Math.max(thr,1e-6))]));
 $("lmin").textContent=f.length?f[0].x.toFixed(3):"0";$("lmax").textContent=thr.toFixed(3);
 
 const key=era+"|"+$("q").value+"|"+DATA.length;
 if(key!==refresh.k){
  refresh.k=key;dg.clearLayers();
  filtered().forEach(d=>{L.circleMarker([d.lat,d.lon],{radius:2.5,color:"#222",weight:.6,fillColor:"#fff",fillOpacity:.9}).on("click",()=>{$("target").value=d.id;refresh()}).addTo(dg)});
  labels();
 }
 
 if(tm)map.removeLayer(tm);
 tm=L.circleMarker([t.lat,t.lon],{radius:7,color:"#fff",weight:2,fillColor:"#000",fillOpacity:1}).addTo(map);
 $("stat").textContent=`Target ${t.id} · ${within.length} of ${f.length} samples within d ≤ ${thr.toFixed(3)}`;
 $("tb").innerHTML=f.slice(0,15).map((o,i)=>`<tr class="m" data-id="${o.d.id}"><td>${i+1}</td><td>${o.d.id}</td><td class="big">${o.x.toFixed(4)}</td><td><span class="pill">${o.d.era}</span></td><td>${o.d.lat.toFixed(1)}, ${o.d.lon.toFixed(1)}</td></tr>`).join("");
 
 const near=f.slice(0,90),pts=e=>near.filter(o=>o.d.era===e).map(o=>({x:o.d.v[0],y:o.d.v[1],l:`${o.d.id} (d=${o.x.toFixed(3)})`}));
 const ds=[
  {label:"Ancient",data:pts("Ancient"),backgroundColor:"#f59e0b",pointRadius:4},
  {label:"Modern",data:pts("Modern"),backgroundColor:"#38bdf8",pointRadius:4},
  {label:"Target",data:[{x:t.v[0],y:t.v[1],l:t.id}],backgroundColor:"#ef4444",borderColor:"#fff",borderWidth:2,pointRadius:9,pointStyle:"star"}
 ];
 
 if(!chart)chart=new Chart($("pca"),{type:"scatter",data:{datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{tooltip:{callbacks:{label:c=>c.raw.l}},legend:{labels:{color:"#8b93a3"}}},scales:{x:{title:{display:true,text:"PC1",color:"#8b93a3"},ticks:{color:"#8b93a3"}},y:{title:{display:true,text:"PC2",color:"#8b93a3"},ticks:{color:"#8b93a3"}}}}});
 else{chart.data.datasets=ds;chart.update()}
}

$("q").oninput=()=>refresh(true);
$("target").onchange=()=>refresh();
$("thr").oninput=()=>refresh();
$("tb").onclick=e=>{
 const r=e.target.closest("tr");if(!r)return;
 const id=r.dataset.id;$("q").value="";era="All";
 [...$("era").children].forEach(x=>x.classList.toggle("on",x.dataset.e==="All"));
 buildSel();$("target").value=id;refresh();
 const targetItem = DATA.find(d=>d.id===id);
 if(targetItem) map.panTo([targetItem.lat,targetItem.lon]);
};

function ingest(text,fixedEra){
 let ok=0,bad=0;const miss=new Set();
 text.split(/\r?\n/).forEach(l=>{
  const p=l.trim().replace(/"/g,"").split(/[,\t;]+/);
  if(p.length<26)return;
  const nm=p[0];let la,lo,er,v;
  if(p.length>=30){la=+p[1];lo=+p[2];er=/^a/i.test(p[3])?"Ancient":"Modern";v=p.slice(4,29).map(Number)}
  else{const pop=nm.split(":")[0],pl=placeOf(pop);v=p.slice(1,26).map(Number);if(v.some(isNaN)){return}if(!pl){miss.add(pop);bad++;return}la=pl[0];lo=pl[1];er=fixedEra!=="Auto"?fixedEra:(pl[2]||"Modern")}
  if(v.length!==25||v.some(isNaN)||isNaN(la)||isNaN(lo)){bad++;return}
  DATA.push({id:nm,pop:nm.split(":")[0],lat:la,lon:lo,era:er,v});ok++
 });
 return{ok,bad,miss:[...miss]}
}

function runImport(extra){
 $("cin").value.split(/\r?\n/).forEach(l=>{
  const p=l.trim().split(/[,\t;]+/);
  if(p.length>=3&&!isNaN(+p[1])&&!isNaN(+p[2]))COORD[p[0].toLowerCase()]=[+p[1],+p[2],p[3]?(/^a/i.test(p[3])?"Ancient":"Modern"):null]
 });
 const r=ingest(extra,$("ie").value);
 $("impmsg").textContent=`${r.ok} rows added`+(r.bad?`, ${r.bad} skipped`:"")+(r.miss.length?`. Unplaced populations: ${r.miss.slice(0,40).join(", ")}`:"");
 refresh(true);
}

$("load").onclick=()=>{runImport($("imp").value)};
$("fil").onchange=async e=>{let t="";for(const f of e.target.files)t+=await f.text()+"\n";$("imp").value=t.length>200000?"":t;runImport(t)};
$("rmsyn").onclick=()=>{DATA=[];lg.clearLayers();$("impmsg").textContent="Built-in sample data cleared.";refresh(true)};

$("ck").value=getS("g25_ck2");
if(getS("g25_ct2"))$("ct").value=getS("g25_ct2");
if(getS("g25_cs2"))$("cs").value=getS("g25_cs2");
$("ckb").onclick=setTiles;$("cs").onchange=setTiles;$("ck").onkeydown=e=>{if(e.key==="Enter")setTiles()};
$("ckc").onclick=()=>{$("ck").value="";setTiles()};
if($("ck").value)setTiles();

labels();buildSel();
if(DATA.length>0) $("target").value=DATA[0].id;
refresh();
</script></body></html>
